
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1b;color:white;font-family:Arial}
header{padding:20px;border-bottom:1px solid #293650;color:#9bbaff;font-weight:bold}
main{max-width:750px;margin:auto;padding:22px 16px}
a{color:#91b2ff;text-decoration:none}
.hero{background:linear-gradient(135deg,#172c55,#39246b);padding:25px;border-radius:18px;margin:20px 0}
.icon{font-size:40px}h1{margin:12px 0}
p{color:#aab8d1;font-size:14px;line-height:1.6}
.card{background:#111a2c;border:1px solid #293650;border-radius:14px;padding:18px}
input,select,textarea{width:100%;padding:13px;background:#080d1b;border:1px solid #35435e;color:white;border-radius:9px;margin:9px 0 15px}
textarea{height:100px}
button{background:#779aff;color:#080d1b;padding:13px;border:0;border-radius:9px;font-weight:bold}
#result{white-space:pre-wrap;line-height:1.7;margin-top:18px;color:#d4def3}
</style>
</head>
<body>
<header>PROJECT MAKER · RESEARCH LAB</header>
<main>
<a href="../index.html">← Back to Home</a>
<section class="hero">
<div class="icon">🔬</div>
<h1>Research Assistant</h1>
<p>Organize research ideas, questions and academic methodology.</p>
</section>
<section class="card">
<h2>Research Workspace</h2>
<label>Research Topic</label>
<input id="topic" placeholder="Enter research topic">
<label>Research Field</label>
<select id="field">
<option>Computer Science</option><option>Engineering</option>
<option>Commerce</option><option>Science</option>
<option>Social Science</option><option>Other</option>
</select>
<label>Research Question or Problem</label>
<textarea id="question" placeholder="What do you want to investigate?"></textarea>
<label>Research Notes</label>
<textarea id="notes" placeholder="Add your observations and ideas"></textarea>
<button onclick="generate()">Prepare Research Outline</button>
<div id="result"></div>
</section>
</main>
<script>
function generate(){
const topic=document.getElementById("topic").value.trim();
if(!topic)return alert("Enter research topic");
const field=document.getElementById("field").value;
const question=document.getElementById("question").value;
const notes=document.getElementById("notes").value;
document.getElementById("result").textContent=
"RESEARCH OUTLINE\n\n"+
"Topic: "+topic+"\nField: "+field+
"\nResearch Question: "+(question||"To be defined")+
"\nNotes: "+(notes||"No notes added")+
"\n\n1. Abstract\n2. Introduction\n3. Background and Literature Review\n4. Research Problem\n5. Research Objectives\n6. Research Questions\n7. Methodology\n8. Data Collection\n9. Analysis and Findings\n10. Limitations\n11. Conclusion\n12. References\n\nResearch reminder: Use reliable sources, verify claims and cite the actual material consulted. This outline does not contain verified research findings.";
}
</script>
</body>
</html>
