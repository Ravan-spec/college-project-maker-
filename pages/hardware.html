<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d1b">
<title>Hardware Projects</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080d1b;color:white;font-family:Arial,sans-serif}
header{padding:19px;border-bottom:1px solid #293650;color:#8eafff;font-weight:bold}
main{max-width:750px;margin:auto;padding:22px 16px 50px}
a{color:#91b2ff;text-decoration:none}
.hero{background:linear-gradient(135deg,#172c55,#39246b);padding:25px;border-radius:18px;margin:20px 0}
.icon{font-size:40px}h1{margin:12px 0;font-size:27px}
p{color:#aab8d1;font-size:14px;line-height:1.6}
h2{font-size:19px;margin:24px 0 14px}
.card{background:#111a2c;border:1px solid #293650;border-radius:14px;padding:18px}
input,select,textarea{width:100%;padding:13px;background:#080d1b;border:1px solid #35435e;color:white;border-radius:9px;margin:9px 0 15px}
textarea{height:100px}
button{background:#779aff;color:#080d1b;padding:13px;border:0;border-radius:9px;font-weight:bold}
#result{white-space:pre-wrap;line-height:1.7;margin-top:18px;color:#d4def3}
</style>
</head>
<body>
<header>PROJECT MAKER</header>
<main>
<a href="../index.html">← Back to Home</a>
<section class="hero">
<div class="icon">⚡</div>
<h1>Hardware Projects</h1>
<p>Plan electronics, robotics, IoT and engineering projects.</p>
</section>
<h2>Hardware Project Planner</h2>
<section class="card">
<label>Project Category</label>
<select id="type">
<option>Electronics</option><option>Internet of Things (IoT)</option>
<option>Robotics</option><option>Arduino</option>
<option>Raspberry Pi</option><option>Mechanical</option>
<option>Other</option>
</select>
<label>Project Name</label>
<input id="topic" placeholder="Example: Smart Dustbin">
<label>Components</label>
<textarea id="parts" placeholder="Example: Arduino, sensor, motor..."></textarea>
<label>Project Description</label>
<textarea id="details" placeholder="What should your project do?"></textarea>
<button onclick="generate()">Create Project Plan</button>
<div id="result"></div>
</section>
</main>
<script>
function generate(){
let t=topic.value.trim();
if(!t)return alert("Enter project name");
result.textContent=
"HARDWARE PROJECT PLAN\n\nProject: "+t+
"\nCategory: "+type.value+
"\nComponents: "+(parts.value||"To be decided")+
"\nDescription: "+(details.value||"Not provided")+
"\n\n1. Introduction\n2. Objectives\n3. Components and Specifications\n4. Circuit/System Design\n5. Working Principle\n6. Assembly\n7. Testing and Safety\n8. Results\n9. Conclusion\n10. Future Scope\n\nNote: Verify component ratings, wiring and safety before building.";
}
</script>
</body>
</html>
