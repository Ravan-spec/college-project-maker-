
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1b;color:white;font-family:Arial}
header{padding:20px;border-bottom:1px solid #293650;color:#9bbaff;font-weight:bold}
main{max-width:750px;margin:auto;padding:22px 16px}
a{color:#91b2ff;text-decoration:none}
.hero{background:linear-gradient(135deg,#172c55,#39246b);padding:25px;border-radius:18px;margin:20px 0}
.icon{font-size:40px}h1{margin:12px 0}
p{color:#aab8d1;font-size:14px;line-height:1.6}
.card{background:#111a2c;border:1px solid #293650;border-radius:14px;padding:18px}
input,textarea{width:100%;padding:13px;background:#080d1b;border:1px solid #35435e;color:white;border-radius:9px;margin:9px 0 15px}
textarea{height:100px}
button{background:#779aff;color:#080d1b;padding:13px;border:0;border-radius:9px;font-weight:bold;margin:5px}
#result{white-space:pre-wrap;background:#f5f5f5;color:#18213b;padding:20px;margin-top:20px;border-radius:10px;line-height:1.7}
</style>
</head>
<body>
<header>PROJECT MAKER · DOCUMENT LAB</header>
<main>
<a href="../index.html">← Back to Home</a>
<section class="hero">
<div class="icon">📝</div>
<h1>Project Report Maker</h1>
<p>Create a structured college project report draft.</p>
</section>
<section class="card">
<h2>Report Information</h2>
<label>Project Title</label>
<input id="topic" placeholder="Project title">
<label>Student Name</label>
<input id="student" placeholder="Your name">
<label>College Name</label>
<input id="college" placeholder="College name">
<label>Department</label>
<input id="department" placeholder="Department">
<label>Project Description</label>
<textarea id="details" placeholder="Describe your project"></textarea>
<button onclick="generate()">Generate Report</button>
<button onclick="copyReport()">Copy Report</button>
<button onclick="window.print()">Print / Save PDF</button>
<div id="result"></div>
</section>
</main>
<script>
let report="";
function generate(){
const topic=document.getElementById("topic").value.trim();
if(!topic)return alert("Enter project title");
const student=document.getElementById("student").value;
const college=document.getElementById("college").value;
const department=document.getElementById("department").value;
const details=document.getElementById("details").value;
const sections=[
["INTRODUCTION",details||"Write an introduction to the project."],
["PROBLEM STATEMENT","Describe the problem this project aims to address."],
["OBJECTIVES","1. Define the main objective.\n2. Identify user requirements.\n3. Develop and evaluate a solution."],
["METHODOLOGY","Describe the steps, tools and methods actually used."],
["REQUIREMENTS","List hardware, software and other requirements."],
["IMPLEMENTATION","Explain the actual development process."],
["TESTING AND RESULTS","Add test cases and actual results."],
["CONCLUSION","Summarize the work and findings."],
["FUTURE SCOPE","Describe possible future improvements."],
["REFERENCES","Add the real books, articles and websites consulted."]
];
report="PROJECT REPORT\n\n"+topic+"\n\nStudent: "+student+
"\nCollege: "+college+"\nDepartment: "+department+"\n\n";
sections.forEach(s=>report+=s[0]+"\n"+s[1]+"\n\n");
document.getElementById("result").textContent=report;
}
function copyReport(){
if(!report)return alert("Generate report first");
navigator.clipboard.writeText(report).then(()=>alert("Report copied"));
}
</script>
</body>
</html>
