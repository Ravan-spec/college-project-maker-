
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPT Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1b;color:white;font-family:Arial}
header{padding:20px;border-bottom:1px solid #293650;color:#9bbaff;font-weight:bold}
main{max-width:750px;margin:auto;padding:22px 16px}
a{color:#91b2ff;text-decoration:none}
.hero{background:linear-gradient(135deg,#172c55,#39246b);padding:25px;border-radius:18px;margin:20px 0}
.icon{font-size:40px}h1{margin:12px 0}
p{color:#aab8d1;line-height:1.6;font-size:14px}
.card{background:#111a2c;border:1px solid #293650;border-radius:14px;padding:18px;margin-top:18px}
input,textarea,select{width:100%;padding:13px;background:#080d1b;border:1px solid #35435e;color:white;border-radius:9px;margin:10px 0 15px}
button{background:#779aff;color:#080d1b;padding:12px;border:0;border-radius:9px;font-weight:bold;margin:5px 5px 5px 0}
#result{margin-top:18px}
.slide{padding:17px;background:#17243b;border:1px solid #35435e;border-radius:12px;margin:12px 0}
.slide h3{color:#9bbaff;margin-bottom:10px}
.slide p{white-space:pre-wrap}
</style>
</head>
<body>
<header>PROJECT MAKER · PRESENTATION</header>
<main>
<a href="../index.html">← Back to Home</a>
<section class="hero">
<div class="icon">📊</div>
<h1>PPT Maker</h1>
<p>Plan presentation slides for your college projects.</p>
</section>
<section class="card">
<h2>Presentation Details</h2>
<label>Project Title</label>
<input id="topic" placeholder="Project name">
<label>Number of Slides</label>
<select id="count">
<option value="5">5 Slides</option>
<option value="8" selected>8 Slides</option>
<option value="10">10 Slides</option>
<option value="12">12 Slides</option>
</select>
<label>Project Description</label>
<textarea id="details" placeholder="Describe your project"></textarea>
<button onclick="makeSlides()">Create Slides</button>
<button onclick="copySlides()">Copy Content</button>
<div id="result"></div>
</section>
</main>
<script>
let slideText="";
function makeSlides(){
const topic=document.getElementById("topic").value.trim();
if(!topic)return alert("Enter project title");
const count=Number(document.getElementById("count").value);
const details=document.getElementById("details").value||"Explain the main idea of your project.";
const headings=[
"Introduction","Problem Statement","Objectives",
"Proposed Solution","Methodology","Tools and Technologies",
"Implementation","Results and Testing","Conclusion","Future Scope",
"Challenges","References"
];
const box=document.getElementById("result");
box.innerHTML="";
slideText="";
for(let i=0;i<count;i++){
const heading=i===0?topic:headings[i]||"Additional Details";
const content=i===0?details:
"Add verified information about "+heading.toLowerCase()+" for "+topic+".";
slideText+="SLIDE "+(i+1)+": "+heading+"\n"+content+"\n\n";
const card=document.createElement("div");
card.className="slide";
const h=document.createElement("h3");
h.textContent="Slide "+(i+1)+" · "+heading;
const p=document.createElement("p");
p.textContent=content;
card.append(h,p);
box.appendChild(card);
}
}
function copySlides(){
if(!slideText)return alert("Create slides first");
navigator.clipboard.writeText(slideText).then(()=>alert("Slides copied"));
}
</script>
</body>
</html>
