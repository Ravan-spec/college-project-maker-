
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagram Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1b;color:white;font-family:Arial}
header{padding:20px;border-bottom:1px solid #293650;color:#9bbaff;font-weight:bold}
main{max-width:750px;margin:auto;padding:22px 16px}
a{color:#91b2ff;text-decoration:none}
.hero{background:linear-gradient(135deg,#172c55,#39246b);padding:25px;border-radius:18px;margin:20px 0}
.icon{font-size:40px}h1{margin:12px 0}
p{color:#aab8d1;line-height:1.6;font-size:14px}
.card{background:#111a2c;border:1px solid #293650;border-radius:14px;padding:18px;margin-top:18px}
input,select,textarea{width:100%;padding:13px;background:#080d1b;border:1px solid #35435e;color:white;border-radius:9px;margin:9px 0 15px}
button{background:#779aff;color:#080d1b;padding:13px;border:0;border-radius:9px;font-weight:bold}
#result{background:white;color:#17233b;padding:15px;border-radius:10px;margin-top:20px;overflow:auto}
pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<header>PROJECT MAKER · DESIGN LAB</header>
<main>
<a href="../index.html">← Back to Home</a>
<section class="hero">
<div class="icon">🔀</div>
<h1>Diagram Maker</h1>
<p>Create basic project flowcharts and system process diagrams.</p>
</section>
<section class="card">
<h2>Diagram Settings</h2>
<label>Diagram Name</label>
<input id="name" placeholder="Example: Login Process">
<label>Diagram Type</label>
<select id="type">
<option>Flowchart</option>
<option>System Workflow</option>
<option>Development Process</option>
</select>
<label>Steps (one per line)</label>
<textarea id="steps" placeholder="Start&#10;Enter Details&#10;Verify User&#10;Show Dashboard&#10;End"></textarea>
<button onclick="createDiagram()">Create Diagram</button>
<button onclick="downloadDiagram()">Download SVG</button>
<div id="result"></div>
</section>
</main>
<script>
let svg="";
function createDiagram(){
const name=document.getElementById("name").value.trim();
const steps=document.getElementById("steps").value.split("\n").map(s=>s.trim()).filter(Boolean);
if(!name||steps.length<2)return alert("Enter diagram name and at least 2 steps");
const w=320,h=90,gap=25;
const height=steps.length*(h+gap)+30;
let elements="";
steps.forEach((s,i)=>{
const y=15+i*(h+gap);
elements+=`<rect x="35" y="${y}" width="250" height="${h}" rx="13" fill="#e7efff" stroke="#315cb0" stroke-width="2"/>`;
elements+=`<text x="160" y="${y+49}" text-anchor="middle" font-size="14" fill="#14294f">${escapeText(s)}</text>`;
if(i<steps.length-1)elements+=`<path d="M160 ${y+h} V${y+h+gap}" stroke="#315cb0" stroke-width="2"/><path d="M154 ${y+h+gap-7} L160 ${y+h+gap} L166 ${y+h+gap-7}" fill="none" stroke="#315cb0" stroke-width="2"/>`;
});
svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${height}" viewBox="0 0 ${w} ${height}"><rect width="100%" height="100%" fill="white"/>${elements}</svg>`;
document.getElementById("result").innerHTML="<h3>"+escapeText(name)+"</h3>"+svg;
}
function escapeText(s){
return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
}
function downloadDiagram(){
if(!svg)return alert("Create diagram first");
const blob=new Blob([svg],{type:"image/svg+xml"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);a.download="project-diagram.svg";a.click();
URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
