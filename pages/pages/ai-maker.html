
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Project Maker</title>
<meta name="theme-color" content="#080d1b">
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1b;color:white;font-family:Arial}
header{padding:20px;border-bottom:1px solid #293650;color:#9bbaff;font-weight:bold}
main{max-width:750px;margin:auto;padding:22px 16px}
a{color:#91b2ff;text-decoration:none}
.hero{margin:20px 0;background:linear-gradient(135deg,#172c55,#39246b);padding:25px;border-radius:18px}
.icon{font-size:40px}h1{font-size:27px;margin:12px 0}
p{color:#aab8d1;line-height:1.6;font-size:14px}
h2{font-size:19px;margin:25px 0 15px}
.card{background:#111a2c;border:1px solid #293650;border-radius:14px;padding:18px}
input,select,textarea{width:100%;padding:13px;background:#080d1b;border:1px solid #35435e;color:white;border-radius:9px;margin:9px 0 15px}
textarea{height:110px}
button{background:#779aff;color:#080d1b;padding:13px;border:0;border-radius:9px;font-weight:bold}
#result{white-space:pre-wrap;line-height:1.7;color:#d4def3;margin-top:18px}
</style>
</head>
<body>
<header>PROJECT MAKER · AI LAB</header>
<main>
<a href="../index.html">← Back to Home</a>
<section class="hero">
<div class="icon">🤖</div>
<h1>AI Project Maker</h1>
<p>Prepare project ideas, requirements and structured planning with AI assistance.</p>
</section>
<h2>Generate Project Plan</h2>
<section class="card">
<label>Course</label>
<select id="course">
<option>B.Tech</option><option>BCA</option><option>MCA</option>
<option>BBA</option><option>B.Com</option><option>B.Sc</option>
<option>Other</option>
</select>
<label>Project Topic</label>
<input id="topic" placeholder="Enter your project topic">
<label>Project Type</label>
<select id="type">
<option>Academic</option><option>Software</option>
<option>Hardware</option><option>Research</option>
</select>
<label>Instructions</label>
<textarea id="details" placeholder="Describe your project requirements"></textarea>
<button onclick="generate()">Generate Draft</button>
<div id="result"></div>
</section>
</main>
<script>
function generate(){
const topic=document.getElementById("topic").value.trim();
if(!topic)return alert("Enter project topic");
const course=document.getElementById("course").value;
const type=document.getElementById("type").value;
const details=document.getElementById("details").value;
document.getElementById("result").textContent=
"AI PROJECT REQUEST\n\nCourse: "+course+
"\nType: "+type+
"\nTopic: "+topic+
"\nRequirements: "+(details||"Not provided")+
"\n\nPROJECT OUTLINE\n1. Introduction\n2. Problem Statement\n3. Objectives\n4. Proposed Solution\n5. Methodology\n6. Tools and Technologies\n7. Implementation Plan\n8. Testing and Evaluation\n9. Conclusion\n10. References\n\nThis is a local starter draft, not an AI-generated answer. Connect a secure AI backend to enable actual AI generation.";
}
</script>
</body>
</html>
