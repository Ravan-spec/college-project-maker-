
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d1b">
<title>My Projects</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d1b;color:white;font-family:Arial,sans-serif}
header{padding:20px;border-bottom:1px solid #293650;color:#9bbaff;font-weight:bold}
main{max-width:750px;margin:auto;padding:22px 16px 60px}
a{color:#91b2ff;text-decoration:none}
.hero{background:linear-gradient(135deg,#172c55,#39246b);padding:25px;border-radius:18px;margin:20px 0}
.icon{font-size:40px}
h1{margin:12px 0}
h2{font-size:19px;margin:24px 0 14px}
p{color:#aab8d1;font-size:14px;line-height:1.6}
.card{background:#111a2c;border:1px solid #293650;border-radius:14px;padding:17px;margin-bottom:13px}
input,textarea{width:100%;padding:13px;background:#080d1b;border:1px solid #35435e;color:white;border-radius:9px;margin:9px 0 15px}
textarea{height:100px}
button{background:#779aff;color:#080d1b;padding:11px 15px;border:0;border-radius:9px;font-weight:bold;margin:5px 4px 5px 0}
.delete{background:#e35d70}
.project{border:1px solid #35435e;padding:15px;border-radius:12px;margin-top:12px}
.project h3{margin:0 0 8px}
.empty{text-align:center;padding:25px;color:#9eabc3}
.small{font-size:11px;color:#8999b5}
</style>
</head>
<body>
<header>PROJECT MAKER · MY WORKSPACE</header>
<main>
<a href="../index.html">← Back to Home</a>

<section class="hero">
<div class="icon">🗂️</div>
<h1>My Projects</h1>
<p>Save, manage and access your college project drafts.</p>
</section>

<section class="card">
<h2>Create New Project</h2>

<label>Project Name</label>
<input id="name" placeholder="Enter project name">

<label>Project Details</label>
<textarea id="details" placeholder="Write your project details"></textarea>

<button onclick="saveProject()">Save Project</button>
</section>

<h2>Saved Projects</h2>
<p>Your projects are saved on this device.</p>
<div id="projectList"></div>

</main>

<script>
const STORAGE_KEY="collegeProjectMakerProjects";

function getProjects(){
try{
return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];
}catch(e){
return [];
}
}

function saveProject(){
const name=document.getElementById("name").value.trim();
const details=document.getElementById("details").value.trim();

if(!name){
alert("Please enter project name");
return;
}

const projects=getProjects();

projects.unshift({
id:Date.now(),
name:name,
details:details,
date:new Date().toLocaleString()
});

try{
localStorage.setItem(STORAGE_KEY,JSON.stringify(projects));
document.getElementById("name").value="";
document.getElementById("details").value="";
renderProjects();
alert("Project saved successfully");
}catch(e){
alert("Storage full or unavailable. Export your projects before continuing.");
}
}

function renderProjects(){
const list=document.getElementById("projectList");
const projects=getProjects();

list.innerHTML="";

if(projects.length===0){
list.innerHTML='<div class="empty">No projects saved yet. Create your first project!</div>';
return;
}

projects.forEach(project=>{
const card=document.createElement("div");
card.className="project";

const title=document.createElement("h3");
title.textContent=project.name;

const description=document.createElement("p");
description.textContent=project.details||"No description added.";

const date=document.createElement("div");
date.className="small";
date.textContent="Saved: "+project.date;

const open=document.createElement("button");
open.textContent="View Project";
open.onclick=()=>viewProject(project.id);

const remove=document.createElement("button");
remove.textContent="Delete";
remove.className="delete";
remove.onclick=()=>deleteProject(project.id);

card.append(title,description,date,open,remove);
list.appendChild(card);
});
}

function viewProject(id){
const project=getProjects().find(p=>p.id===id);
if(!project)return;

alert("PROJECT: "+project.name+"\n\n"+project.details);
}

function deleteProject(id){
if(!confirm("Delete this project permanently from this device?"))return;

const projects=getProjects().filter(p=>p.id!==id);
localStorage.setItem(STORAGE_KEY,JSON.stringify(projects));
renderProjects();
}

renderProjects();
</script>
</body>
</html>
